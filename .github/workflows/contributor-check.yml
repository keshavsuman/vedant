name: Contributor Attribution Check

# Disabled for the Tomorrow / Keshav white-label deploy — the contributors/
# directory has been removed. This workflow always succeeds so CI callers
# that still `needs: contributor-check` keep working.

on:
  workflow_call:
    outputs:
      review_status:
        description: "JSON array of review status objects"
        value: ${{ jobs.check-attribution.outputs.review_status }}

permissions:
  contents: read

jobs:
  check-attribution:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      review_status: ${{ steps.check-emails.outputs.review_status }}
    steps:
      - name: Skip contributor mapping check
        id: check-emails
        run: |
          echo "Contributor directory removed — attribution check skipped."
          echo "review_status=[]" >> "$GITHUB_OUTPUT"
